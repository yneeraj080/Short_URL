name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # Keepalives stop the SSH session from dropping during long builds.
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -i ~/.ssh/deploy_key "$EC2_USERNAME@$EC2_HOST" << 'REMOTE'
            set -e
            cd /home/ubuntu/Short_URL
            git pull origin main
            # Build one image at a time: building everything at once ran the
            # 1 GB server out of memory (OOM killed MongoDB and the API).
            docker compose build backend
            docker compose build worker
            docker compose build frontend
            docker compose up -d
            # One time only (skips if already done): build the daily click
            # counters from existing clicks. The worker is paused meanwhile
            # (clicks keep queueing in Redis) and always started again.
            docker compose stop worker
            docker compose exec -T backend node scripts/backfillClickStats.js --once --force || echo "Click counter backfill FAILED - see output above"
            docker compose start worker
            # Remove old, unused images so the disk doesn't fill up over time.
            docker image prune -f
            docker compose ps
          REMOTE
