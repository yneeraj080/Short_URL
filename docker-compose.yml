services:
  backend:
    build: ./backend
    # cluster.js runs WEB_CONCURRENCY copies of index.js (one per CPU core you
    # want to use). Default 1; set e.g. WEB_CONCURRENCY=4 in the shell to change.
    command: ["node", "cluster.js"]
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      RUN_ANALYTICS_WORKER: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      # In-memory hot-link cache per API process (ms, 0 = off). A deleted link
      # can keep redirecting this long on processes that didn't handle the delete.
      HOT_CACHE_TTL_MS: ${HOT_CACHE_TTL_MS:-5000}
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_healthy
  worker:
    build: ./backend
    command: ["node", "worker.js"]
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mongo-data: